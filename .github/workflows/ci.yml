name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
      - dev

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [test, lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        if: matrix.check == 'test'
        run: npm run test -- --run

      - name: Run ESLint
        if: matrix.check == 'lint'
        run: npm run lint
